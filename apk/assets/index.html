<head>
<meta charset="utf-8"/>

<title>快门波段 SHUTTERBAND · 空域频率图</title>
<style>
  :root{
    --bg:#0b1016; --panel:#131b24; --panel2:#18222e; --line:#243240;
    --txt:#e8eef5; --dim:#8ba0b5; --acc:#39d0ff; --warn:#ffb454;
    --vfr:#4ade80; --app:#39d0ff; --acc2:#a78bfa; --twr:#fb7185;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Noto Sans SC","PingFang SC",system-ui,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{padding:10px 14px 8px;background:linear-gradient(180deg,#101821,#0b1016);
    border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
  .t1{font-size:16px;font-weight:700;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px}
  .t1 small{font-size:11px;color:var(--dim);font-weight:500;letter-spacing:1px}
  .t2{margin-top:3px;font-size:11px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
  .t3{margin-top:8px;display:flex;gap:6px;align-items:center}
  .t3 select{flex:1;min-width:0;background:#0e1720;color:#cfe6f5;border:1px solid var(--line);
    border-radius:8px;padding:7px 8px;font-size:12px}
  .t3 button{background:#16212c;color:#9fd4ea;border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:12px}
  .badge{border:1px solid #2a4b5e;background:#0e2631;color:#7fe3ff;border-radius:4px;
    padding:1px 5px;font-size:10px}
  main{flex:1 1 auto;position:relative;min-height:0}
  #map{position:absolute;inset:0;touch-action:none;background:
    radial-gradient(1200px 600px at 50% 0%,#0e1720 0%,#080d12 70%)}
  svg{width:100%;height:100%;display:block}
  .poly{cursor:pointer;transition:fill-opacity .15s,stroke-opacity .15s}
  .poly:active{fill-opacity:.5}
  .lbl{font-size:10.5px;fill:#cfe6f5;pointer-events:none;paint-order:stroke;
    stroke:#060a0e;stroke-width:2.6px;stroke-linejoin:round;font-weight:600}
  .lbl.sm{font-size:9px;fill:#9fb6c9;font-weight:500}
  .freqlbl{font-size:10px;fill:#39d0ff;font-weight:700;pointer-events:none;
    paint-order:stroke;stroke:#04080c;stroke-width:2.8px}
  #hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
  .chip{font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);
    background:#0d151dcc;color:var(--dim);backdrop-filter:blur(6px)}
  .chip.on{color:#04121a;background:var(--acc);border-color:var(--acc);font-weight:700}
  #zoom{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:6px}
  #zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:#0d151dcc;color:var(--txt);font-size:17px;line-height:1}
  #sheet{position:absolute;left:0;right:0;bottom:0;max-height:62%;overflow:auto;
    background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    padding:12px 14px 22px;transform:translateY(101%);transition:transform .25s ease;
    box-shadow:0 -18px 40px #000a}
  #sheet.up{transform:translateY(0)}
  #sheet h3{margin:0 0 2px;font-size:15px}
  #sheet .sub{color:var(--dim);font-size:11px;margin-bottom:10px}
  .fr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1c2836}
  .fr:last-child{border-bottom:0}
  .fr b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.4px}
  .fr .k{font-size:11px;color:var(--dim);flex:1}
  .fr .tag{font-size:10px;color:#7fe3ff;border:1px solid #2a4b5e;border-radius:4px;padding:0 4px}
  #tabs{display:flex;gap:6px;padding:8px 12px 0;flex:0 0 auto}
  #tabs button{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--dim);font-size:12px}
  #tabs button.on{background:var(--panel2);color:var(--txt);border-color:#2f4a5e;font-weight:700}
  .list{position:absolute;inset:0;overflow:auto;padding:10px 12px 60px;display:none;background:var(--bg)}
  .list.show{display:block}
  .grp{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .grp h4{margin:0;padding:9px 12px;font-size:12px;background:#0f1821;color:#9fd4ea;
    border-bottom:1px solid var(--line);letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #18222e}
  .row:last-child{border-bottom:0}
  .row .nm{flex:0 0 auto;width:86px;font-size:12px;color:var(--dim)}
  .row .fv{flex:1;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .row .ex{font-size:10px;color:#6f8698;text-align:right;line-height:1.35;max-width:44%}
  .foot{color:#5d7386;font-size:10.5px;line-height:1.7;padding:4px 2px 30px}
  .foot b{color:#8ba0b5}
  a{color:var(--acc)}
  .toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;
    background:#39d0ff;color:#04121a;font-size:12px;font-weight:700;padding:8px 14px;
    border-radius:999px;transition:.2s;pointer-events:none;z-index:20}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>

const P = (lat, lon) => [lat, lon];
let D = null;

// ---------- projection ----------
let proj = {lat0: 37.75, lon0: 112.63, k: 1, w: 0, h: 0, scale: 1, ox: 0, oy: 0, tx: 0, ty: 0};
function makeProjection(bounds, w, h){
  const [minLat, maxLat, minLon, maxLon] = bounds;
  const lat0 = (minLat + maxLat) / 2, lon0 = (minLon + maxLon) / 2;
  const cos = Math.cos(lat0 * Math.PI / 180);
  // world units: x = (lon-lon0)*cos, y = -(lat-lat0)
  const sx = (maxLon - minLon) * cos, sy = (maxLat - minLat);
  const pad = 0.10;
  const scale = Math.min(w / (sx * (1 + pad * 2)), h / (sy * (1 + pad * 2)));
  return {lat0, lon0, cos, scale, w, h, ox: w / 2, oy: h / 2, tx: 0, ty: 0};
}
function pt(p){
  const x = (p[1] - proj.lon0) * proj.cos * proj.scale;
  const y = -(p[0] - proj.lat0) * proj.scale;
  return [proj.ox + x + proj.tx, proj.oy + y + proj.ty];
}
const path = pts => pts.map((p, i) => { const [x, y] = pt(p); return (i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1); }).join(' ') + ' Z';
function centroid(pts){
  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++) {
    const p0 = pts[i], p1 = pts[(i + 1) % pts.length];
    const f = p0[1] * p1[0] - p1[1] * p0[0];
    a += f; cx += (p0[1] + p1[1]) * f; cy += (p0[0] + p1[0]) * f;
  }
  a *= 3;
  if (Math.abs(a) < 1e-12) { const m = pts.reduce((s, p) => [s[0] + p[0], s[1] + p[1]], [0, 0]); return [m[0] / pts.length, m[1] / pts.length]; }
  return [cy / a, cx / a];
}
function vfmt(s){
  s = String(s||"").replace(/s+/g," ").trim();
  if (!s) return "";
  if (/Same as Taiyuan/i.test(s)) return "同太原进近边界";
  if (/In area/i.test(s)) return "6000 m–GND（部分 7800 m–GND）";
  return s.replace(/—+/g,"–").replace(/s*–s*/g,"–");
}
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// ---------- layer state ----------
const layerOn = {tma: true, ctr: true, acc: true, nav: true, rwy: true};
let viewMode = 'tyn';

// ---------- render ----------
function render(){
  const svg = document.getElementById('svg');
  const w = svg.clientWidth || svg.getBoundingClientRect().width || window.innerWidth, h = svg.clientHeight || svg.getBoundingClientRect().height || (window.innerHeight - 150);
  const all = [];
  D.tma && all.push(...D.tma.pts);
  (D.ctr || []).forEach(c => all.push(...c.pts));
  const vis = (D.sectors || []).filter(s => s.pts && s.pts.length && (viewMode === 'pek' || s.tyn));
  all.push(...vis.flatMap(s => s.pts), D.arp);
  const lats = all.map(p => p[0]), lons = all.map(p => p[1]);
  const b = [Math.min(...lats), Math.max(...lats), Math.min(...lons), Math.max(...lons)];
  // 限制在太原终端区附近，避免外围扇区把视野拉太大
  if (viewMode === 'tyn') {
    b[0] = Math.max(b[0], 36.6); b[1] = Math.min(b[1], 39.0);
    b[2] = Math.max(b[2], 111.0); b[3] = Math.min(b[3], 114.4);
  }
  proj = makeProjection(b, w, h);
  proj.tx = 0; proj.ty = 0; zoom = 1;

  let g = '';
  // 区调扇区
  if (layerOn.acc) {
    (D.sectors || []).filter(s => s.pts && s.pts.length >= 3).forEach((s, i) => {
      const isMain = s.tyn;
      const c = centroid(s.pts);
      const [lx, ly] = pt(c);
      g += `<path class="poly" data-kind="acc" data-i="${i}" d="${path(s.pts)}"
        fill="${isMain ? '#a78bfa' : '#4b6b86'}" fill-opacity="${isMain ? .17 : .06}"
        stroke="${isMain ? '#a78bfa' : '#33546b'}" stroke-width="${isMain ? 1.6 : .9}" stroke-opacity=".9"/>`;
      if (isMain || viewMode === 'pek') {
        g += `<text class="lbl${isMain ? '' : ' sm'}" x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="middle">${esc(s.nameEn)}</text>`;
        g += `<text class="freqlbl" x="${lx.toFixed(1)}" y="${(ly + 11).toFixed(1)}" text-anchor="middle" ${isMain ? '' : 'style="fill:#7fa8c4"'}>${esc((s.freqs[0] || {}).f || '')}</text>`;
      }
    });
  }
  // 进近区
  if (layerOn.tma && D.tma) {
    const c = centroid(D.tma.pts), [lx, ly] = pt(c);
    g += `<path class="poly" data-kind="tma" d="${path(D.tma.pts)}" fill="#39d0ff" fill-opacity=".10"
      stroke="#39d0ff" stroke-width="2" stroke-dasharray="7 4"/>`;
    g += `<text class="lbl" x="${lx.toFixed(1)}" y="${(ly + 26).toFixed(1)}" text-anchor="middle" fill="#7fe3ff">太原进近 ZBYNAPP</text>`;
  }
  // 塔台区
  if (layerOn.ctr) {
    (D.ctr || []).forEach((c, i) => {
      const [lx, ly] = pt(centroid(c.pts));
      g += `<path class="poly" data-kind="ctr" data-i="${i}" d="${path(c.pts)}" fill="#fb7185" fill-opacity=".14"
        stroke="#fb7185" stroke-width="1.8"/>`;
      g += `<text class="lbl sm" x="${lx.toFixed(1)}" y="${(ly - 4).toFixed(1)}" text-anchor="middle" fill="#ffb3c0">塔台 TWR 118.25</text>`;
    });
  }
  // 跑道
  if (layerOn.rwy) {
    const [ax, ay] = pt(D.arp);
    const mPerPx = 1 / proj.scale; // 度/px
    // 真实几何：真方位 139°，双跑道 3600m，间距 490m，13R 比 13L 东移 1350m
    const brg = (133 + 5.9) * Math.PI / 180; // 磁 133 + 磁差 5.9W → 真 139
    const cosLat = Math.cos(D.arp[0] * Math.PI / 180);
    const degPerM = 1 / 111320;
    const L = 3600 * degPerM, sep = 490 * degPerM, off = 1350 * degPerM;
    const dirV = [Math.sin(brg) * L, Math.cos(brg) * L / cosLat]; // 沿 139°
    const nrm = [Math.cos(brg) * sep, -Math.sin(brg) * sep / cosLat];
    const pairs = [
      {d: '13L/31R', cx: 0, cy: 0, col: '#dbe7f1'},
      {d: '13R/31L', cx: Math.cos(brg) * off, cy: -Math.sin(brg) * off / cosLat, col: '#dbe7f1'}
    ];
    pairs.forEach((pr, i) => {
      const x1 = ax + pt2px(pr.cx - nrm[0] / 2, dirV)[0], y1 = ay + pt2px(pr.cx - nrm[0] / 2, dirV)[1];
      // 简化：直接用像素长度画
      const pxPerDeg = proj.scale;
      const halfL = L / 2 * pxPerDeg;
      const dx = Math.sin(brg), dy = -Math.cos(brg);
      // 每条跑道中心（横向偏移）
      const ox = (i === 0 ? -sep / 2 : off + sep / 2) * pxPerDeg * Math.cos(brg);
      const oy = (i === 0 ? -sep / 2 : off + sep / 2) * pxPerDeg * Math.sin(brg);
      const cxp = ax + ox, cyp = ay + oy;
      const x2 = cxp + dx * halfL, y2 = cyp + dy * halfL;
      const x3 = cxp - dx * halfL, y3 = cyp - dy * halfL;
      g += `<line x1="${x3.toFixed(1)}" y1="${y3.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
        stroke="#0b1016" stroke-width="9" stroke-linecap="round"/>`;
      g += `<line x1="${x3.toFixed(1)}" y1="${y3.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}"
        stroke="${pr.col}" stroke-width="5" stroke-linecap="round"/>`;
    });
    g += `<circle cx="${ax.toFixed(1)}" cy="${ay.toFixed(1)}" r="2.4" fill="#fb7185"/>`;
    g += `<text class="lbl" x="${(ax + 14).toFixed(1)}" y="${(ay + 4).toFixed(1)}">武宿 ZBYN</text>`;
  }
  // 导航台
  if (layerOn.nav) {
    const v = (D.navs || []).find(n => n.id === 'TYN');
    if (v) {
      const m = /N(\d+)°(\d+\.?\d*)′\s*E(\d+)°(\d+\.?\d*)′/.exec(String(v.lat) + ' ' + String(v.lon));
      let la = 37.7533, lo = 112.6167;
      if (m) { la = +m[1] + +m[2] / 60; lo = +m[3] + +m[4] / 60; }
      const [x, y] = pt([la, lo]);
      const R = Math.min(proj.w, proj.h) * 0.30;
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${R.toFixed(1)}" fill="none" stroke="#39d0ff" stroke-opacity=".18" stroke-dasharray="2 6"/>`;
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(R * 2 / 3).toFixed(1)}" fill="none" stroke="#39d0ff" stroke-opacity=".10" stroke-dasharray="2 6"/>`;
      g += `<path d="M${(x - 9).toFixed(1)} ${y.toFixed(1)} L${(x + 9).toFixed(1)} ${y.toFixed(1)} M${x.toFixed(1)} ${(y - 9).toFixed(1)} L${x.toFixed(1)} ${(y + 9).toFixed(1)}" stroke="#39d0ff" stroke-width="1.2"/>`;
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="#39d0ff"/>`;
      g += `<text class="lbl" x="${(x + 8).toFixed(1)}" y="${(y - 8).toFixed(1)}" fill="#7fe3ff">TYN 113.10</text>`;
    }
  }
  // 自定义点（扩展数据可加 points: [{name, lat, lon, freq, kind}]）
  if (Array.isArray(D.points)) {
    D.points.forEach(p => {
      const [x, y] = pt([p.lat, p.lon]);
      const col = p.kind === "NDB" ? "#ffb454" : p.kind === "VOR" ? "#39d0ff" : "#8be9a8";
      g += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="none" stroke="${col}" stroke-width="1.6"/>`;
      g += `<text class="lbl sm" x="${(x + 7).toFixed(1)}" y="${(y + 3).toFixed(1)}" fill="${col}">${esc(p.name || "")} ${esc(p.freq || "")}</text>`;
    });
  }
  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = `<g id="world">${g}</g>`;
  bindPicks();
}
let zoom = 1;
function pt2px(){ return [0, 0]; }

function bindPicks(){
  svgEl().querySelectorAll('.poly').forEach(el => {

    fr('APP02 主用', '119.550', '进近', '备用 125.550') +

    `<div style="color:#8ba0b5;font-size:11px;margin-top:10px">塔台 118.250 · 地面 121.800 · 放行 121.925 · 机坪 121.675</div>`);
}
function showCtr(i){
  const c = D.ctr[i];
  showSheet(c.nameCn || c.nameEn, `垂直 ${esc(c.vertical)}`,
    fr('塔台 TWR', '118.250', 'TWR', '备用 124.350') +
    fr('地面 GND', '121.800', 'GND', '') +
    fr('放行 DEL', '121.925', 'DEL', '工作时间 HO') +
    fr('机坪 APN', '121.675', 'APN', '') +
    fr('通播 ATIS', '126.450', 'ATIS', 'H24'));
}
function showSector(i){
  const s = D.sectors[i];
  const rows = s.freqs.map(f => fr(f.f, `${f.rank === 'PRIMARY' ? '主用' : '备用'} ${f.open ? '· ' + f.open : ''}`, f.rank === 'PRIMARY' ? '主' : '备', '')).join('');
  showSheet(`${s.nameCn} ${s.nameEn}`, `${esc(s.call)} · ${esc(s.unit)} · 垂直 ${esc(vfmt(s.vertical))}`, rows);
}
function copy(txt){
  if (!txt) return;
  const t = document.getElementById('toast');
  const done = () => { t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 900); };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, done);
  else { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done(); }
}

// pan / zoom
svgEl().addEventListener('pointerdown', e => {
  drag = {x: e.clientX, y: e.clientY, tx: proj.tx, ty: proj.ty, moved: false};
  svgEl().setPointerCapture(e.pointerId);
});
svgEl().addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
  proj.tx = drag.tx + dx; proj.ty = drag.ty + dy;
  applyView();
});
svgEl().addEventListener('pointerup', () => { setTimeout(() => { drag = null; }, 0); });
svgEl().addEventListener('pointercancel', () => { drag = null; });
function applyView(){
  const g = document.getElementById('world');
  if (!g) return;
  g.setAttribute('transform', `translate(${(proj.ox * (1 - zoom) + proj.tx).toFixed(1)},${(proj.oy * (1 - zoom) + proj.ty).toFixed(1)}) scale(${zoom})`);
}
document.getElementById('zin').onclick = () => { zoom = Math.min(6, zoom * 1.35); applyView(); };
document.getElementById('zout').onclick = () => { zoom = Math.max(.55, zoom / 1.35); applyView(); };
document.getElementById('zfit').onclick = () => { render(); };

document.querySelectorAll('#hud .chip').forEach(c => c.onclick = () => {
  if (c.dataset.view) {
    viewMode = viewMode === 'pek' ? 'tyn' : 'pek';
    document.querySelectorAll('#hud .chip[data-view]').forEach(x => x.classList.toggle('on', viewMode === 'pek'));
    render(); return;
  }
  const k = c.dataset.layer; layerOn[k] = !layerOn[k];
  c.classList.toggle('on', layerOn[k]); render();
});

// tabs
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  const map = document.getElementById('map');
  const tbl = document.getElementById('listTbl'), src = document.getElementById('listSrc');
  map.style.display = b.dataset.tab === 'map' ? '' : 'none';
  tbl.classList.toggle('show', b.dataset.tab === 'tbl');
  src.classList.toggle('show', b.dataset.tab === 'src');
  if (b.dataset.tab !== 'map') document.getElementById('sheet').classList.remove('up');
});

// ---------- list ----------
function buildTable(){
  const g = (t, rows) => `<div class="grp"><h4>${t}</h4>${rows}</div>`;
  const r = (n, f, ex) => `<div class="row" data-f="${esc(f)}"><div class="nm">${esc(n)}</div><div class="fv">${esc(f)}</div><div class="ex">${esc(ex || '')}</div></div>`;
  const main = D.sectors.filter(s => s.tyn);
  const others = D.sectors.filter(s => !s.tyn);
  let h = '';
  h += g('塔台 / 地面 / 放行（武宿）',
    r('塔台 TWR', '118.250', '备用 124.350') +
    r('塔台备用', '124.350', '') +
    r('地面 GND', '121.800', 'H24') +
    r('放行 DEL', '121.925', '工作时间 HO') +
    r('机坪 APN', '121.675', 'H24') +
    r('通播 ATIS', '126.450', 'H24') +
    r('应急 EMG', '121.500', '国际遇险应急'));
  h += g('进近（太原进近管制区 GND–5100m）',
    r('APP01', '119.200', '主用 H24 · 备 125.550') +
    r('APP02', '119.550', '主用 H24 · 备 125.550') +
    r('进近备用', '125.550', 'APP01/02 共用'));
  h += g('区调 · 太原区域管制室（北京区域 ZBPE）',
    main.map(s => r(`${s.nameEn} ${s.nameCn}`, s.freqs[0].f, '备 ' + (s.freqs[1] || {}).f + ' · ' + vfmt(s.vertical))).join('') || r('AR33', '120.550', ''));
  h += g('导航设施（VOR / ILS）',
    r('TYN VOR/DME', '113.100', 'N37°45.2′ E112°37.0′ · H24') +
    r('ICC LOC 13L', '110.900', 'ILS CAT I') +
    r('ICC GP 13L', '330.800', '下滑台 UHF') +
    r('IBB LOC 31R', '109.300', 'ILS CAT I') +
    r('IBB GP 31R', '332.000', '') +
    r('INP LOC 13R', '109.700', 'ILS CAT I') +
    r('INP GP 13R', '333.200', '') +
    r('IMK LOC 31L', '108.550', 'ILS CAT III') +
    r('IMK GP 31L', '329.750', '') +
    r('IM 31L', '75.000', '指点标 MHz'));
  if (others.length) h += g('区调 · 北京区域管制中心（ZBPE，其余 ' + others.length + ' 个扇区）',
    others.map(s => r(`${s.call} ${s.nameEn}`, s.freqs[0].f, '备 ' + (s.freqs[1] || {}).f + ' · ' + vfmt(s.vertical))).join(''));
  document.getElementById('listTbl').innerHTML = h +
    `<div class="foot">点任意一行复制频率。含北京管制区（ZBPE）全部 42 个区调扇区；太原区域管制室为 AR33/34/35。数值单位 MHz。</div>`;
  document.querySelectorAll('#listTbl .row').forEach(el => el.onclick = () => copy(el.dataset.f));
}

function buildSrc(){
  document.getElementById('listSrc').innerHTML = `
  <div class="grp"><h4>数据来源与版本</h4>
    <div class="row"><div class="nm" style="width:auto;flex:1">数据包</div><div class="ex" style="max-width:60%">EAIP 2026-12 (V1.3)</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">生效 / 失效</div><div class="ex" style="max-width:60%">2026-11-26 00:00 / 2026-12-24 00:00 (北京时间)</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">对应</div><div class="ex" style="max-width:60%">2611/12 期（NAIP 第 12 期 / AIRAC 2612）</div></div>
  </div>
  <div class="grp"><h4>取用的 AIP 章节</h4>
    <div class="row"><div class="nm" style="width:auto;flex:1">AD 2 ZBYN</div><div class="ex" style="max-width:60%">2.2 机场资料 / 2.12 跑道 / 2.17 ATS 空域 / 2.18 通信设施 / 2.19 导航设施</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">ENR 2.1.5</div><div class="ex" style="max-width:60%">终端/进近管制区（太原进近 10 点边界，GND–5100m）</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">ENR 2.1.3</div><div class="ex" style="max-width:60%">区域管制区扇区（AR33/AR34/AR35 太原区域管制室）</div></div>
  </div>
  <div class="foot">
    <b>关于精度：</b>边界点按 AIP 原文 DDMMSS 换算，图上为等距圆柱投影示意，比例与真实地理投影有差异；跑道按 3600×45 m、磁方位 133°、磁差 5°53′W 绘制，两条跑道中心线间距 490 m、13R 相对 13L 东移 1350 m。<br><br>
    <b>关于用途：</b>本页由公开可得的中国民航 eAIP 数据整理，供模拟飞行、学习与资料核对使用。真实飞行必须以现行有效 AIP、NAIP 及管制指令为准；ILS 下滑台（GP）与指点标频率为机载接收频率，不可用于通话。<br><br>
    <b>未包含：</b>二次雷达/ADS-B、D-ATIS 数据链、军用、通航临时频率，以及未在 AIP 公布的管制移交/内部通信频率。
  </div>`;
}

// ---------- packs ----------
const LSK = "taiyuan-airspace.packs.v1";
let PACKS = [];
const EMB = window.__EMBEDDED_DATA__ || null;

function loadPacks(){
  let extra = [];
  try { extra = JSON.parse(localStorage.getItem(LSK) || "[]") || []; } catch(e) { extra = []; }
  PACKS = [].concat(EMB ? [EMB] : [], extra);
}
function packLabel(p, i){
  const m = p.meta || p;
  const nm = (p.site && p.site.nameCn) || p.name || "数据集";
  const cy = m.cycle || p.cycle || "";
  return `${nm}${cy ? " · " + cy : ""}`;
}
function fillSelect(){
  const s = document.getElementById("packSel");
  s.innerHTML = PACKS.map((p, i) => `<option value="${i}">${esc(packLabel(p, i))}</option>`).join("");
}
function usePack(i){
  D = PACKS[i]; if (!D) return;
  document.getElementById("arpTop").textContent = "ARP " + (D.arpText || "");
  document.getElementById("packSel").value = String(i);
  document.getElementById("sheet").classList.remove("up");
  buildTable(); buildSrc(); render();
}
function saveExtra(){
  const extra = PACKS.slice(EMB ? 1 : 0);
  try { localStorage.setItem(LSK, JSON.stringify(extra)); } catch(e) { alert("保存失败：存储空间不足"); }
}
document.getElementById("packSel").onchange = e => usePack(+e.target.value);
document.getElementById("impBtn").onclick = () => document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const arr = Array.isArray(j) ? j : (j.packs || [j]);
      arr.forEach(p => { if (!p || !p.arp) throw new Error("缺少 arp 字段"); PACKS.push(p); });
      saveExtra(); fillSelect(); usePack(PACKS.length - arr.length);
    } catch (err) { alert("导入失败：" + err.message); }
  };
  r.readAsText(f, "utf-8");
  e.target.value = "";
};
document.getElementById("expBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(D, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = ((D.site && D.site.id) || "airspace") + "-data.json";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};

// 桌面版：读取程序目录 data/ 下的扩展数据包（浏览器直接打开时该请求会失败，忽略即可）
async function loadFolderPacks(){
  try {
    const r = await fetch("packs.json", { cache: "no-store" });
    if (!r.ok) return;
    const arr = await r.json();
    if (!Array.isArray(arr) || !arr.length) return;
    const key = p => ((p.site && p.site.id) || "") + "|" + ((p.meta && p.meta.cycle) || p.cycle || "");
    const have = new Set(PACKS.map(key));
    let added = 0;
    arr.forEach(p => { if (p && p.arp && !have.has(key(p))) { PACKS.push(p); added++; } });
    if (added) { fillSelect(); usePack(PACKS.length - 1); }
  } catch (e) { /* file:// 模式忽略 */ }
}

// ---------- boot ----------
loadPacks();
if (PACKS.length) {
  fillSelect(); usePack(0);
} else {
  fetch("data.json").then(r => r.json()).then(d => {
    PACKS = [d]; fillSelect(); usePack(0);
  }).catch(e => {
    document.getElementById("map").innerHTML = '<div style="padding:20px;color:#f88">数据加载失败: ' + e.message + '</div>';
  });
}
window.addEventListener("resize", () => { if (D) render(); });
</script>
