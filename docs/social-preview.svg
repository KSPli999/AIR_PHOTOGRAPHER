  <text x="72" y="150" font-family="sans-serif" font-size="58" font-weight="bold" fill="#ffffff">天际电波 SKYWAVE</text>
  <text x="72" y="205" font-family="sans-serif" font-size="27" fill="#8fc9e8">Airband atlas of China — tower / approach / area-control frequencies on one map</text>
