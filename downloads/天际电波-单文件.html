<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>天际电波 SKYWAVE · 全国空管频率图</title>
<style>
  :root{
    --bg:#0b1016; --panel:#131b24; --panel2:#18222e; --line:#243240;
    --txt:#e8eef5; --dim:#8ba0b5; --acc:#39d0ff; --warn:#ffb454;
    --vfr:#4ade80; --app:#39d0ff; --acc2:#a78bfa; --twr:#fb7185;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);
    font-family:-apple-system,"Noto Sans SC","PingFang SC",system-ui,sans-serif}
  body{display:flex;flex-direction:column;overflow:hidden}
  header{padding:10px 14px 8px;background:linear-gradient(180deg,#101821,#0b1016);
    border-bottom:1px solid var(--line);flex:0 0 auto;z-index:5}
  .t1{font-size:16px;font-weight:700;letter-spacing:.5px;display:flex;align-items:baseline;gap:8px}
  .t1 small{font-size:11px;color:var(--dim);font-weight:500;letter-spacing:1px}
  .t2{margin-top:3px;font-size:11px;color:var(--dim);display:flex;gap:10px;flex-wrap:wrap}
  .t3{margin-top:8px;display:flex;gap:6px;align-items:center}
  .t3 select{flex:1;min-width:0;background:#0e1720;color:#cfe6f5;border:1px solid var(--line);
    border-radius:8px;padding:7px 8px;font-size:12px}
  .t3 button{background:#16212c;color:#9fd4ea;border:1px solid var(--line);border-radius:8px;
    padding:7px 10px;font-size:12px}
  .badge{border:1px solid #2a4b5e;background:#0e2631;color:#7fe3ff;border-radius:4px;
    padding:1px 5px;font-size:10px}
  main{flex:1 1 auto;position:relative;min-height:0}
  #map{position:absolute;inset:0;touch-action:none;background:
    radial-gradient(1200px 600px at 50% 0%,#0e1720 0%,#080d12 70%)}
  svg{width:100%;height:100%;display:block;touch-action:none}
  .poly{cursor:pointer;transition:fill-opacity .15s,stroke-opacity .15s}
  .poly:active{fill-opacity:.5}
  .lbl{font-size:10.5px;fill:#cfe6f5;pointer-events:none;paint-order:stroke;
    stroke:#060a0e;stroke-width:2.6px;stroke-linejoin:round;font-weight:600}
  .lbl.sm{font-size:9px;fill:#9fb6c9;font-weight:500}
  .freqlbl{font-size:10px;fill:#39d0ff;font-weight:700;pointer-events:none;
    paint-order:stroke;stroke:#04080c;stroke-width:2.8px}
  .apt{font-size:11px;fill:#ffe0a3;font-weight:700;pointer-events:none;paint-order:stroke;
    stroke:#05090d;stroke-width:2.8px;stroke-linejoin:round}
  .aptdot{cursor:pointer}
  #hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 20px)}
  .chip{font-size:11px;padding:5px 9px;border-radius:999px;border:1px solid var(--line);
    background:#0d151dcc;color:var(--dim);backdrop-filter:blur(6px)}
  .chip.on{color:#04121a;background:var(--acc);border-color:var(--acc);font-weight:700}
  #legend{position:absolute;left:10px;bottom:12px;font-size:10px;color:#7f95a8;
    background:#0d151dcc;border:1px solid var(--line);border-radius:10px;padding:6px 9px;line-height:1.7}
  #legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
  #zoom{position:absolute;right:10px;bottom:14px;display:flex;flex-direction:column;gap:6px}
  #zoom button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);
    background:#0d151dcc;color:var(--txt);font-size:17px;line-height:1}
  #sheet{position:absolute;left:0;right:0;bottom:0;max-height:64%;overflow:auto;
    background:var(--panel);border-top:1px solid var(--line);border-radius:16px 16px 0 0;
    padding:12px 14px calc(22px + env(safe-area-inset-bottom, 0px));transform:translateY(101%);transition:transform .25s ease;
    box-shadow:0 -18px 40px #000a;z-index:8}
  #sheet.up{transform:translateY(0)}
  #sheet h3{margin:0 0 2px;font-size:15px}
  #sheet .sub{color:var(--dim);font-size:11px;margin-bottom:10px}
  .fr{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #1c2836}
  .fr:last-child{border-bottom:0}
  .fr b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:.4px}
  .fr .k{font-size:11px;color:var(--dim);flex:1}
  .fr .tag{font-size:10px;color:#7fe3ff;border:1px solid #2a4b5e;border-radius:4px;padding:0 4px}
  .fr .ex{font-size:10px;color:#6f8698;text-align:right;line-height:1.35;max-width:46%}
  #tabs{display:flex;gap:6px;padding:8px 12px 0;flex:0 0 auto}
  #tabs button{flex:1;padding:9px 6px;border-radius:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--dim);font-size:12px}
  #tabs button.on{background:var(--panel2);color:var(--txt);border-color:#2f4a5e;font-weight:700}
  .list{position:absolute;inset:0;overflow:auto;padding:10px 12px 60px;display:none;background:var(--bg)}
  .list.show{display:block}
  .grp{margin:0 0 14px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
  .grp h4{margin:0;padding:9px 12px;font-size:12px;background:#0f1821;color:#9fd4ea;
    border-bottom:1px solid var(--line);letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid #18222e}
  .row:last-child{border-bottom:0}
  .row .nm{flex:0 0 auto;width:96px;font-size:12px;color:var(--dim)}
  .row .fv{flex:1;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
  .row .ex{font-size:10px;color:#6f8698;text-align:right;line-height:1.35;max-width:46%}
  .foot{color:#5d7386;font-size:10.5px;line-height:1.7;padding:4px 2px 30px}
  .foot b{color:#8ba0b5}
  a{color:var(--acc)}
  .toast{position:absolute;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;
    background:#39d0ff;color:#04121a;font-size:12px;font-weight:700;padding:8px 14px;
    border-radius:999px;transition:.2s;pointer-events:none;z-index:20}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  .topbar{position:sticky;top:-10px;z-index:2;background:var(--bg);padding:2px 0 8px}
  .topbar input{width:100%;background:#0e1720;color:var(--txt);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;font-size:13px}
  .hint{color:#6f8698;font-size:10.5px;margin:0 2px 8px}
</style>
</head>
<body>
<header>
  <div class="t1">天际电波<small>SKYWAVE · AIRBAND ATLAS</small></div>
  <div class="t2" style="color:#7f95a8">全国空管频率 · 塔台 / 进近 / 区调</div>
  <div class="t2">
    <span class="badge" id="cycBadge">EAIP</span>
    <span id="effTxt"></span>
    <span>·</span><span id="statTxt"></span>
  </div>
  <div class="t3">
    <select id="packSel" title="数据集"></select>
    <button id="impBtn">导入</button>
    <button id="expBtn">导出</button>
    <input type="file" id="fileIn" accept=".json,application/json" hidden/>
  </div>
</header>

<div id="tabs">
  <button class="on" data-tab="map">空域图</button>
  <button data-tab="tbl">频率总表</button>
  <button data-tab="src">数据说明</button>
</div>

<main>
  <div id="map">
    <svg id="svg"></svg>
    <div id="hud">
      <div class="chip on" data-layer="acc">区调</div>
      <div class="chip on" data-layer="tma">进近</div>
      <div class="chip on" data-layer="twr">塔台区</div>
      <div class="chip on" data-layer="apt">机场</div>
      <div class="chip on" id="baseChip">底图 卫星</div>
    </div>
    <div id="legend">
      <div><i style="background:#a78bfa"></i>区域管制扇区</div>
      <div><i style="background:#39d0ff"></i>进近管制区</div>
      <div><i style="background:#fb7185"></i>塔台管制区</div>
      <div><i style="background:#ffd27f"></i>机场（点开看频率）</div>
      <div style="margin-top:3px;color:#5d7386">双指缩放 · 拖动平移 · 放大到机场可见跑道</div>
      <div id="baseAttr" style="color:#4f6475"></div>
    </div>
    <div id="zoom">
      <button id="zin">+</button><button id="zout">−</button><button id="zfit">⤢</button>
    </div>
  </div>

  <div class="list" id="listTbl">
    <div class="topbar"><input id="q" placeholder="搜索机场 / 单位 / 频率，如 太原、ZBAA、118.25"/></div>
    <div class="hint" id="qinfo"></div>
    <div id="tblBody"></div>
  </div>
  <div class="list" id="listSrc"></div>

  <div id="sheet">
    <h3 id="shTitle"></h3>
    <div class="sub" id="shSub"></div>
    <div id="shBody"></div>
  </div>
  <div class="toast" id="toast">已复制</div>
</main>

// ---------- projection ----------
let proj = {lat0: 35, lon0: 104, cos: 1, scale: 1, w: 0, h: 0, ox: 0, oy: 0, tx: 0, ty: 0};
function makeProjection(bounds, w, h){
  const [minLat, maxLat, minLon, maxLon] = bounds;
  const lat0 = (minLat + maxLat) / 2, lon0 = (minLon + maxLon) / 2;
  const cos = Math.cos(lat0 * Math.PI / 180);
  const sx = Math.max((maxLon - minLon) * cos, .2), sy = Math.max(maxLat - minLat, .2);
  const pad = 0.08;
  const scale = Math.min(w / (sx * (1 + pad * 2)), h / (sy * (1 + pad * 2)));
  return {lat0, lon0, cos, scale, w, h, ox: w / 2, oy: h / 2, tx: 0, ty: 0, ext: null};
}
// 全国数据范围：地图平移的硬边界（与当前是否聚焦机场无关）
function nationalBounds(){
  const pts = [];
  D.sectors.forEach(s => pts.push(...s.pts));
  D.areas.forEach(s => pts.push(...s.pts));
  D.ctr.forEach(s => pts.push(...s.pts));
  D.airports.forEach(a => pts.push(a.arp));
  (D.border || []).forEach(r => pts.push(...r));
  (D.fir || []).forEach(x => ringsOf(x).forEach(r => pts.push(...r)));
  let minLat = 90, maxLat = -90, minLon = 180, maxLon = -180;
  for (const p of pts) {
    if (p[0] < minLat) minLat = p[0];
    if (p[0] > maxLat) maxLat = p[0];
    if (p[1] < minLon) minLon = p[1];
    if (p[1] > maxLon) maxLon = p[1];
  }
  return [minLat, maxLat, minLon, maxLon];
}
function pt(p){
  const x = (p[1] - proj.lon0) * proj.cos * proj.scale;
  const y = -(p[0] - proj.lat0) * proj.scale;
  return [proj.ox + x, proj.oy + y];   // 平移/缩放由 #world 的 transform 统一处理

function viewBounds(){
  const z = zoom || 1;
  const wx = s => proj.ox + (s - proj.ox - proj.tx) / z;
  const wy = s => proj.oy + (s - proj.oy - proj.ty) / z;
  return {x0: wx(0), x1: wx(proj.w), y0: wy(0), y1: wy(proj.h)};

const TILE_MIN = 8, TILE_MAX = 18;
const TILE_MODES = {
  sat: {
    attr: '影像 © Esri, Maxar, Earthstar Geographics',
    url: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}`
  },

function tileLayer(){
  tilesOn = false;

  if (!mode) return '';

  const mpp = 111320 / (proj.scale * z);                       // 当前米/屏幕像素
  let tz = Math.round(Math.log2(156543.03392 * Math.cos(proj.lat0 * Math.PI / 180) / mpp));

  const vb = {x0: base.x0 - padX, x1: base.x1 + padX, y0: base.y0 - padY, y1: base.y1 + padY};

  ty0 = Math.max(0, ty0); ty1 = Math.min(n - 1, ty1);

        width="${(bx - ax + 1).toFixed(1)}" height="${(by - ay + 1).toFixed(1)}"

  let a = 0, cx = 0, cy = 0;
  for (let i = 0; i < pts.length; i++) {

function vfmt(s){

    .replace(/\s*–\s*/g, "–")

    attrEl.textContent = tilesOn ? TILE_MODES[baseMode].attr
      : (TILE_MODES[baseMode] && zoom >= 4 ? '继续放大，加载卫星底图' : '');
  }
  // ---- 情报区边界 ----
  (D.fir || []).forEach((f) => {
    g += `<path d="${pathAll(f)}" fill="none" stroke="#5b9dc4" stroke-opacity=".28"
      stroke-width="${(1 / Math.max(1, zc / 1.6)).toFixed(2)}" stroke-dasharray="${(7 / zc).toFixed(3)} ${(6 / zc).toFixed(3)}"/>`;
  });
  // ---- 区调扇区 ----
  if (layerOn.acc) {
    D.sectors.forEach((s, i) => {
      g += `<path class="poly" data-kind="sec" data-i="${i}" d="${pathAll(s)}"
        fill="#a78bfa" fill-opacity=".07" stroke="#6d5fae" stroke-width="${(0.8 / Math.max(1, zc / 1.6)).toFixed(2)}" stroke-opacity=".8"/>`;
      if (zc >= 2.2) {
        const [bw, bh] = bboxPx(s.pts);
        const [lx, ly] = pt(centroid(s.pts));
        if (bw > 34 && bh > 20) {
          addLabel(lx, ly, s.nameEn, '#a9c1d4', 'lbl sm', 3, 9, (s.freqs[0] || {}).f || '', '#c3b3fa');
        }
      }
    });
  }
  // ---- 进近区 ----
  if (layerOn.tma) {
    D.areas.forEach((a, i) => {
      const sub = a.sub;
      g += `<path class="poly" data-kind="ap" data-i="${i}" d="${pathAll(a)}"
        fill="#39d0ff" fill-opacity="${sub ? .05 : .08}" stroke="#39d0ff" stroke-width="${(sub ? 0.8 : 1.4) / Math.max(1, zc / 1.6)}"
        stroke-opacity="${sub ? .45 : .8}" stroke-dasharray="${((sub ? 3 : 7) / zc).toFixed(3)} ${((sub ? 5 : 4) / zc).toFixed(3)}"/>`;
      if (zc >= (sub ? 3.0 : 1.9)) {
        const [bw, bh] = bboxPx(a.pts);
        const [lx, ly] = pt(centroid(a.pts));
        if (bw > 34 && bh > 20) {
          const f = pf(a.freqs);
          addLabel(lx, ly, a.nameCn, '#9fe6ff', 'lbl sm', sub ? 2 : 4, 9.5, f ? f.split(' / ')[0] : '', '#7fe3ff');
        }
      }
    });
  }
  // ---- 塔台管制区 ----
  if (layerOn.twr) {
    D.ctr.forEach((c, i) => {
      g += `<path class="poly" data-kind="twr" data-i="${i}" d="${pathAll(c)}" fill="#fb7185" fill-opacity=".10"
        stroke="#fb7185" stroke-width="${(1 / zc).toFixed(3)}" stroke-opacity=".7"/>`;
      if (zc >= 3.6) {
        const [bw, bh] = bboxPx(c.pts);
        if (bw > 20 && bh > 16) {
          const [lx, ly] = pt(centroid(c.pts));
          addLabel(lx, ly, '塔台区', '#ffb3c0', 'lbl sm', 1, 9);
        }
      }
    });
  }
  // ---- 机场 ----
  if (layerOn.apt) {
    const aptLabels = [];
    D.airports.forEach((a, i) => {
      const [x, y] = pt(a.arp);
      const big = a.comms.some(c => c.type === 'TWR');
      g += `<circle class="aptdot" data-kind="apt" data-i="${i}" cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(big ? 3 : 2.2) / Math.max(1, zc / 2)}"
        fill="#ffd27f" fill-opacity=".95" stroke="#3a2a10" stroke-width="${(0.8 / zc).toFixed(3)}"/>`;
      if (zc >= 1.7) aptLabels.push({a, x, y, prio: a.iata ? 6 : 5});
    });
    // 机场标注按 IATA 优先，先放大的
    aptLabels.sort((p, q) => q.prio - p.prio);
    for (const it of aptLabels) {
      const tw = (it.a.comms.find(c => c.type === 'TWR') || {}).f || '';
      addLabel(it.x + 7 / zc, it.y + 4 / zc, it.a.nameCn || it.a.id, '#ffe6b8', 'apt', it.prio, 10, zc >= 2.3 ? tw : '', '#c8ad72', 'start');
    }
  }

  svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
  svg.innerHTML = `<g id="world">${g}${placeLabels(labels)}</g>`;
  applyView();
  bindPicks();
}

// 标注避让：按优先级贪心放置，重叠就丢弃
function placeLabels(items){
  items.sort((a, b) => b.prio - a.prio);
  const placed = [];
  let out = '';
  const fsr = Math.max(1, zoom);
  // 描边宽度按屏幕像素给，必须除掉缩放，否则放大后被 scale() 拉成黑气泡
  const swOf = cls => ((cls === 'freqlbl' || cls === 'apt') ? 2.8 : 2.6) / fsr;
  for (const it of items) {
    const fsW = it.fs / fsr;                       // 世界坐标下的字号（屏幕上恒为 it.fs px）
    const swW = swOf(it.cls).toFixed(2);
    const wtxt = it.text + (it.sub ? ' ' + it.sub : '');
    const w = Math.max(12 / fsr, wtxt.length * fsW * (/[\u4e00-\u9fa5]/.test(wtxt) ? 1.0 : 0.62));
    const h = fsW * (it.sub ? 2.3 : 1.25);
    const x0 = it.anchor === 'start' ? it.x : it.x - w / 2;
    const r = [x0, it.y - fsW * 0.95, w, h];
    if (placed.some(p => r[0] < p[0] + p[2] && r[0] + r[2] > p[0] && r[1] < p[1] + p[3] && r[1] + r[3] > p[1])) continue;
    placed.push(r);
    out += `<text class="${it.cls}" x="${it.x.toFixed(2)}" y="${it.y.toFixed(2)}" text-anchor="${it.anchor}" fill="${it.fill}" style="font-size:${fsW.toFixed(2)}px;stroke-width:${swW}px">${esc(it.text)}</text>`;
    if (it.sub) out += `<text class="freqlbl" x="${it.x.toFixed(2)}" y="${(it.y + fsW * 1.3).toFixed(2)}" text-anchor="${it.anchor}" fill="${it.subFill}" style="font-size:${fsW.toFixed(2)}px;stroke-width:${swOf('freqlbl').toFixed(2)}px">${esc(it.sub)}</text>`;
  }
  return out;
}

// 经纬网，填充地图留白并给出方位感
function grid(P, z, vb){
  let s = '';
  const x0 = 68, x1 = 140, y0 = 8, y1 = 56;
  const [ax, ay] = pt([y0, x0]), [bx, by] = pt([y1, x1]);
  const top = Math.max(ay, vb.y0), bot = Math.min(by, vb.y1);
  const left = Math.max(ax, vb.x0), right = Math.min(bx, vb.x1);
  for (let lon = 70; lon <= 140; lon += 10) {
    const [x] = pt([y0, lon]);
    if (x < vb.x0 - 20 || x > vb.x1 + 20) continue;
    s += `<line x1="${x.toFixed(1)}" y1="${top.toFixed(1)}" x2="${x.toFixed(1)}" y2="${bot.toFixed(1)}" stroke="#16232e" stroke-width="${(0.7 / z).toFixed(2)}"/>`;
    if (x > vb.x0 + 16 && x < vb.x1 - 16) s += `<text x="${(x + 2).toFixed(1)}" y="${(bot - 4).toFixed(1)}" font-size="${(9 / z).toFixed(1)}" fill="#2f4354">${lon}°E</text>`;
  }
  for (let lat = 10; lat <= 55; lat += 10) {
    const [, y] = pt([lat, x0]);
    if (y < vb.y0 - 20 || y > vb.y1 + 20) continue;
    s += `<line x1="${left.toFixed(1)}" y1="${y.toFixed(1)}" x2="${right.toFixed(1)}" y2="${y.toFixed(1)}" stroke="#16232e" stroke-width="${(0.7 / z).toFixed(2)}"/>`;
    if (y > vb.y0 + 12 && y < vb.y1 - 6) s += `<text x="${(left + 3).toFixed(1)}" y="${(y - 3).toFixed(1)}" font-size="${(9 / z).toFixed(1)}" fill="#2f4354">${lat}°N</text>`;
  }
  return s;
}

const FREQ_TAG = {TWR:'塔台', GND:'地面', DEL:'放行', Delivery:'放行', APN:'机坪', RAMP:'机坪', ATIS:'通播', APP:'进近', ACC:'区调', CTR:'管制', FIS:'情报', EMG:'应急', 'OP-CTL':'管制', AOC:'签派'};

function copy(txt){
  if (!txt) return;
  const t = document.getElementById('toast');
  const done = () => { t.classList.add('on'); setTimeout(() => t.classList.remove('on'), 900); };

  else { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); done(); }

// pan / pinch zoom / 边界限制
const ZMIN = .7, ZMAX = 12000;
let drag = null, pinch = null, suppressClick = false;
const pointers = new Map();
function localXY(e){
  const r = svgEl().getBoundingClientRect();
  return {x: e.clientX - r.left, y: e.clientY - r.top};
}
// 缩放上限随投影比例变化：换算成瓦片 z 不超过 TILE_MAX，全国视角和聚焦视角手感一致
function zoomCap(){
  if (!proj || !proj.scale) return ZMAX;
  const mpp1 = 111320 / proj.scale;   // zoom=1 时每像素多少米
  const cap = (2 ** TILE_MAX) * mpp1 / (156543.03392 * Math.cos(proj.lat0 * Math.PI / 180));
  return Math.min(ZMAX, Math.max(1, cap));
}
function clampZoom(z){ return Math.min(zoomCap(), Math.max(ZMIN, z)); }
// 平移边界：内容铺不满的方向居中锁定，铺满的方向不许拖出画面
function clampView(){
  const e = proj.ext;
  if (!e) return;
  const z = zoom, ox = proj.ox, oy = proj.oy, w = proj.w, h = proj.h;
  const x0 = ox + z * e.x0, x1 = ox + z * e.x1;   // 内容左右边缘（屏幕坐标，未加 tx）
  if (x1 - x0 >= w) proj.tx = Math.min(-x0, Math.max(w - x1, proj.tx));
  else proj.tx = (w - (x0 + x1)) / 2;
  const y0 = oy + z * e.y0, y1 = oy + z * e.y1;
  if (y1 - y0 >= h) proj.ty = Math.min(-y0, Math.max(h - y1, proj.ty));
  else proj.ty = (h - (y0 + y1)) / 2;
}
function applyView(){
  clampView();
  const g = document.getElementById('world');
  if (!g) return;
  g.setAttribute('transform', `translate(${(proj.ox * (1 - zoom) + proj.tx).toFixed(1)},${(proj.oy * (1 - zoom) + proj.ty).toFixed(1)}) scale(${zoom})`);
}
// 双指：以两指中点为锚点缩放，同时跟随中点平移
function startPinch(){
  const [a, b] = [...pointers.values()];
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  pinch = {
    d0: Math.hypot(a.x - b.x, a.y - b.y) || 1,
    z0: zoom,
    u: (mx - proj.ox - proj.tx) / zoom,   // 锚点对应的世界坐标偏移
    v: (my - proj.oy - proj.ty) / zoom
  };
}
function endGesture(){
  pinch = null;   // 等所有手指抬起后再重排，避免连续两次重建
}
svgEl().addEventListener('pointerdown', e => {
  const p = localXY(e);
  pointers.set(e.pointerId, p);
  if (pointers.size === 1) {
    drag = {x: p.x, y: p.y, moved: false, dist: 0};
  } else if (pointers.size === 2) {
    drag = null;
    startPinch();
  }
});
svgEl().addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  const p = localXY(e);
  pointers.set(e.pointerId, p);
  if (pinch && pointers.size >= 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    zoom = clampZoom(pinch.z0 * d / pinch.d0);
    proj.tx = mx - proj.ox - pinch.u * zoom;
    proj.ty = my - proj.oy - pinch.v * zoom;
    applyView();
  } else if (drag) {
    const dx = p.x - drag.x, dy = p.y - drag.y;
    drag.dist += Math.abs(dx) + Math.abs(dy);
    if (drag.dist > 6) drag.moved = true;
    drag.x = p.x; drag.y = p.y;
    proj.tx += dx; proj.ty += dy;
    applyView();
  }
});
function pointerEnd(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (pointers.size === 2) { startPinch(); return; }   // 三指变两指，重新锚定
  if (pointers.size === 1) {
    endGesture();
    const p = [...pointers.values()][0];
    drag = {x: p.x, y: p.y, moved: true, dist: 99};   // 一手抬起后按剩余手指继续拖
    return;
  }
  if (pointers.size === 0) {
    const moved = !!pinch || (drag && drag.moved);
    endGesture();
    drag = null;
    if (moved) {
      suppressClick = true; setTimeout(() => { suppressClick = false; }, 300);
      render(true);   // 手势结束后刷新瓦片与新视野内的标注
    }
  }
}
svgEl().addEventListener('pointerup', pointerEnd);
svgEl().addEventListener('pointercancel', pointerEnd);
// 鼠标在画布外松开也要结束手势
window.addEventListener('pointerup', pointerEnd);
window.addEventListener('pointercancel', pointerEnd);
window.addEventListener('blur', () => { pointers.clear(); pinch = null; drag = null; });
// 桌面端滚轮缩放（以指针为中心）
svgEl().addEventListener('wheel', e => {
  e.preventDefault();
  const p = localXY(e);
  const u = (p.x - proj.ox - proj.tx) / zoom;
  const v = (p.y - proj.oy - proj.ty) / zoom;
  zoom = clampZoom(zoom * (e.deltaY < 0 ? 1.12 : 1 / 1.12));
  proj.tx = p.x - proj.ox - u * zoom;
  proj.ty = p.y - proj.oy - v * zoom;
  applyView();
  clearTimeout(svgEl()._wt);
  svgEl()._wt = setTimeout(() => render(true), 140);
}, {passive: false});
document.getElementById('zin').onclick = () => { zoom = clampZoom(zoom * 1.4); render(true); };
document.getElementById('zout').onclick = () => { zoom = clampZoom(zoom / 1.4); render(true); };
document.getElementById('zfit').onclick = () => { focus = null; render(); };

document.querySelectorAll('#hud .chip').forEach(c => {
  if (c.id === 'baseChip') return;
  c.onclick = () => {
    const k = c.dataset.layer; layerOn[k] = !layerOn[k];
    c.classList.toggle('on', layerOn[k]); render(true);
  };
});
// 底图循环：卫星 → OSM → 关
function updateBaseChip(){
  const c = document.getElementById('baseChip');
  if (!c) return;
  c.textContent = baseMode === 'sat' ? '底图 卫星' : baseMode === 'osm' ? '底图 OSM' : '底图 关';
  c.classList.toggle('on', !!TILE_MODES[baseMode]);
}
document.getElementById('baseChip').onclick = () => {
  baseMode = baseMode === 'sat' ? 'osm' : baseMode === 'osm' ? 'off' : 'sat';
  try { localStorage.setItem(BASE_KEY, baseMode); } catch (e) {}
  updateBaseChip(); render(true);
};
updateBaseChip();

// tabs
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => {
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  const map = document.getElementById('map');
  const tbl = document.getElementById('listTbl'), src = document.getElementById('listSrc');
  map.style.display = b.dataset.tab === 'map' ? '' : 'none';
  tbl.classList.toggle('show', b.dataset.tab === 'tbl');
  src.classList.toggle('show', b.dataset.tab === 'src');
  if (b.dataset.tab !== 'map') document.getElementById('sheet').classList.remove('up');
  if (b.dataset.tab === 'map') render();
});

// ---------- 频率总表 ----------
function buildTable(){
  const q = (document.getElementById('q').value || '').trim().toLowerCase();
  const hit = (...v) => !q || v.some(x => String(x == null ? '' : x).toLowerCase().includes(q));
  const row = (nm, f, ex, sub) => `<div class="row" data-f="${esc(f)}" ${sub ? `data-apt="${esc(sub)}"` : ''}>
    <div class="nm">${esc(nm)}</div><div class="fv">${esc(f)}</div><div class="ex">${esc(ex || '')}</div></div>`;
  const g = (t, rows) => `<div class="grp"><h4>${t}</h4>${rows}</div>`;
  let h = '', nApt = 0, nSec = 0, nApp = 0;

  // 机场
  let aptRows = '';
  for (const a of D.airports) {
    const rows = a.comms.filter(c => hit(a.id, a.nameCn, a.nameEn, c.f, c.type, c.cn, c.en));
    if (!rows.length) continue;
    nApt++;
    aptRows += `<div class="row" data-apt="${esc(a.id)}" style="background:#0f1821"><div class="nm" style="width:auto;flex:0 0 auto;color:#9fd4ea;font-weight:700">${esc(a.id)}</div><div class="fv" style="font-size:13px">${esc(a.nameCn)}</div><div class="ex">${esc(a.nameEn)}</div></div>`;
    aptRows += rows.map(c => row(`${FREQ_TAG[c.type] || c.type} ${c.cn || ''}`.trim(), c.f,
      [c.alt ? '备 ' + c.alt : '', c.time, c.note].filter(Boolean).join(' · '), a.id)).join('');
  }
  if (aptRows) h += g(`机场通信 · 塔台/地面/放行/机坪/通播（${nApt} 个机场）`, aptRows);

  // 进近
  let appRows = '';
  for (const a of D.areas) {
    if (!a.freqs.length) continue;
    if (!hit(a.nameCn, a.nameEn, a.loc, a.call, a.unit)) continue;
    nApp++;
    appRows += row(`${a.nameCn} ${a.call || ''}`.trim(), pf(a.freqs), [a.loc, a.vertical ? vfmt(a.vertical) : ''].filter(Boolean).join(' · '));
  }
  if (appRows) h += g(`进近管制区 / 扇区 ENR 2.1.5（${nApp} 个）`, appRows);

  // 区调
  let secRows = '';
  for (const s of D.sectors) {
    if (!hit(s.nameEn, s.nameCn, s.call, s.unit)) continue;
    nSec++;
    secRows += row(`${s.call} ${s.nameEn}`, pf(s.freqs), [s.unit, s.vertical ? vfmt(s.vertical) : ''].filter(Boolean).join(' · '));
  }
  if (secRows) h += g(`区域管制扇区 ENR 2.1.3（${nSec} 个）`, secRows);

  if (!h) h = `<div class="grp"><h4>没有匹配</h4><div class="row" style="color:#8ba0b5">换个关键词，例如「太原」「ZBAA」「118.25」</div></div>`;
  document.getElementById('tblBody').innerHTML = h +
    `<div class="foot">点任意一行复制频率。数据来自中国民航 eAIP ${esc(D.meta && D.meta.cycle || D.cycle || '')}，单位 MHz。</div>`;
  document.getElementById('qinfo').textContent = q ? `匹配：机场 ${nApt} · 进近 ${nApp} · 区调 ${nSec}` : '';
  document.querySelectorAll('#tblBody .row').forEach(el => {
    el.onclick = () => {
      if (el.dataset.apt) {
        const a = D.airports.findIndex(x => x.id === el.dataset.apt);
        if (a >= 0) {
          focus = D.airports[a].id;
          document.querySelectorAll('#tabs button')[0].click();
          zoom = 50; render(true);   // 直接落到机场尺度，卫星底图能看清跑道
          return;
        }
      }
      copy(el.dataset.f);
    };
  });
}

function buildSrc(){
  const m = D.meta || {};
  document.getElementById('listSrc').innerHTML = `
  <div class="grp"><h4>数据来源与版本</h4>
    <div class="row"><div class="nm" style="width:auto;flex:1">数据包</div><div class="ex" style="max-width:62%">${esc(m.cycle || D.cycle || '')}</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">生效 / 失效</div><div class="ex" style="max-width:62%">${esc(m.effective || D.effective || '')} / ${esc(m.nextEffective || D.nextEffective || '')}（北京时间）</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">覆盖范围</div><div class="ex" style="max-width:62%">${D.airports.length} 个机场 · ${D.areas.filter(a => a.freqs.length).length} 个进近区/扇区 · ${D.sectors.length} 个区调扇区 · ${D.ctr.length} 个塔台管制区</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">频率条数</div><div class="ex" style="max-width:62%">${D.airports.reduce((s, a) => s + a.comms.length, 0)} 条机场通信 · ${D.sectors.reduce((s, x) => s + x.freqs.length, 0)} 条区调 · ${D.areas.reduce((s, x) => s + x.freqs.length, 0)} 条进近</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">在线底图</div><div class="ex" style="max-width:62%">放大到城市级后自动加载瓦片，可切换卫星 / OSM / 关。影像 © Esri, Maxar, Earthstar Geographics；OSM 底图 © OpenStreetMap contributors（ODbL）。离线时自动回落到矢量底图</div></div>
  </div>
  <div class="grp"><h4>取用的 AIP 章节</h4>
    <div class="row"><div class="nm" style="width:auto;flex:1">AD 2.18</div><div class="ex" style="max-width:62%">机场通信设施：塔台、地面、放行、机坪、通播、进近</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">AD 2.19 / 2.12</div><div class="ex" style="max-width:62%">导航设施（VOR/DME/ILS 等）与跑道</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">AD 2.17</div><div class="ex" style="max-width:62%">塔台管制区等 ATS 空域边界</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">ENR 2.1.5</div><div class="ex" style="max-width:62%">进近（终端）管制区与 APxx 扇区频率</div></div>
    <div class="row"><div class="nm" style="width:auto;flex:1">ENR 2.1.3</div><div class="ex" style="max-width:62%">区域管制区扇区主备频率（全国 ACC）</div></div>
  </div>
  <div class="foot">
    <b>关于精度：</b>边界点按 AIP 原文 DDMMSS 换算，图上为等距圆柱投影示意，比例与真实地理投影有差异；扇区边界密集处缩放后查看更清楚。<br><br>
    <b>关于用途：</b>本页由公开可得的中国民航 eAIP 数据整理，供模拟飞行、学习与资料核对使用。真实飞行必须以现行有效 AIP、NAIP 及管制指令为准；ILS 下滑台（GP）与指点标频率为机载接收频率，不可用于通话。<br><br>
    <b>未包含：</b>二次雷达/ADS-B、D-ATIS 数据链、军用、通航临时频率，以及未在 AIP 公布的管制移交/内部通信频率。
  </div>`;
}

// ---------- packs ----------
const IS_APP = !!(window.DSHApp && window.DSHApp.version());
const LSK = "skywave.packs.v2";
let PACKS = [];
const EMB = window.__EMBEDDED_DATA__ || null;

function loadPacks(){
  let extra = [];
  try { extra = JSON.parse(localStorage.getItem(LSK) || "[]") || []; } catch(e) { extra = []; }
  PACKS = [].concat(EMB ? [EMB] : [], extra);
}
function packLabel(p){
  const m = p.meta || p;
  const nm = m.national ? '全国' : ((p.site && p.site.nameCn) || p.name || "数据集");
  const cy = m.cycle || p.cycle || "";
  const n = p.airports ? p.airports.length : 0;
  return `${nm}${n ? ' · ' + n + ' 机场' : ''}${cy ? " · " + cy : ""}`;
}
function fillSelect(){
  const s = document.getElementById("packSel");
  s.innerHTML = PACKS.map((p, i) => `<option value="${i}">${esc(packLabel(p))}</option>`).join("");
}
function usePack(i){
  D = PACKS[i]; if (!D) return;
  // 兼容不完整的导入数据
  D.airports = D.airports || []; D.sectors = D.sectors || []; D.areas = D.areas || []; D.ctr = D.ctr || [];
  D.airports.forEach(a => { a.comms = a.comms || []; a.navs = a.navs || []; a.runways = a.runways || []; });
  D.areas.forEach(a => { a.freqs = a.freqs || []; });
  D.sectors.forEach(s => { s.freqs = s.freqs || []; });
  focus = null;
  document.getElementById("cycBadge").textContent = (D.meta && D.meta.cycle) || D.cycle || '';
  document.getElementById("effTxt").textContent = '生效 ' + ((D.meta && D.meta.effective) || D.effective || '');
  document.getElementById("statTxt").textContent = D.airports ? `${D.airports.length} 机场 · ${D.sectors.length} 区调扇区 · ${D.areas.filter(a => a.freqs.length).length} 进近扇区` : '';
  document.getElementById("packSel").value = String(i);
  document.getElementById("sheet").classList.remove("up");
  buildTable(); buildSrc(); render();
}
function saveExtra(){
  const extra = PACKS.slice(EMB ? 1 : 0);
  try { localStorage.setItem(LSK, JSON.stringify(extra)); } catch(e) { alert("保存失败：存储空间不足"); }
}
document.getElementById("packSel").onchange = e => usePack(+e.target.value);
document.getElementById("impBtn").onclick = () => document.getElementById("fileIn").click();
document.getElementById("fileIn").onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result);
      const arr = Array.isArray(j) ? j : (j.packs || [j]);
      arr.forEach(p => { if (!p || !p.airports || !p.sectors) throw new Error("需要全国格式（含 airports / sectors）"); PACKS.push(p); });
      saveExtra(); fillSelect(); usePack(PACKS.length - arr.length);
    } catch (err) { alert("导入失败：" + err.message); }
  };
  r.readAsText(f, "utf-8");
  e.target.value = "";
};
if (IS_APP) { document.getElementById("expBtn").style.display = "none"; }
document.getElementById("expBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(D)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "skywave-cn-data.json";
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
};
document.getElementById("q").addEventListener("input", buildTable);

// ---------- boot ----------
loadPacks();
if (PACKS.length) { fillSelect(); usePack(0); }
else {
  fetch("data/CN.json").then(r => r.json()).then(d => { PACKS = [d]; fillSelect(); usePack(0); })
    .catch(e => { document.getElementById("map").innerHTML = '<div style="padding:20px;color:#f88">数据加载失败: ' + e.message + '</div>'; });
}
window.addEventListener("resize", () => { if (D) render(); });
</script>
</body>
</html>
